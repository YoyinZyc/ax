name: Release AX CLI & Verify macOS + Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Cross-compile ax CLI for macOS and Linux
        run: |
          mkdir -p dist
          for target in "darwin amd64" "darwin arm64" "linux amd64" "linux arm64"; do
            set -- $target
            os="$1"
            arch="$2"
            stage_dir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$stage_dir/ax" ./cmd/ax
            tar -czf "dist/ax_${os}_${arch}.tar.gz" -C "$stage_dir" ax
            rm -rf "$stage_dir"
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum ax_*.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ax-cli-archives
          path: dist/*

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/ax_*.tar.gz dist/checksums.txt dist/install.sh --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false
          else
            gh release create "${GITHUB_REF_NAME}" dist/ax_*.tar.gz dist/checksums.txt dist/install.sh --generate-notes
          fi

  verify-macos-arm64:
    needs: release-cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod

      - name: Verify install.sh installs both ax and ax-studio on Apple Silicon macOS
        run: |
          uname -a
          sw_vers
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh" \
            | AX_GITHUB_REPO="${GITHUB_REPOSITORY}" \
              AX_VERSION="${GITHUB_REF_NAME}" \
              AX_STUDIO_GITHUB_REPO="YoyinZyc/studio" \
              AX_STUDIO_VERSION="v0.1.0-test" \
              sh
          file "${HOME}/.ax/bin/ax"
          file "${HOME}/.ax/bin/ax-studio"
          "${HOME}/.ax/bin/ax" version
          "${HOME}/.ax/bin/ax-studio" --version
          "${HOME}/.ax/bin/ax" studio --port 18080 --no-open &
          STUDIO_PID=$!
          trap 'kill "$STUDIO_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              echo ""
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'
          kill -TERM "$STUDIO_PID"
          wait "$STUDIO_PID" || true
