syntax = "proto3";

package ax.v1alpha1;

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

// TODO(ws3/yongrui): Finalize EgressRule and credential reference schema
// (align with https://github.com/google/ax/issues/549).
//
// EgressRule is referenced by:
//   - WorkspaceSetup.egress (scoped exclusively to the workspace setup actor;
//     never inherited by Task actors).
//   - TaskSpec.egress and ForkOverrides.egress (scoped to the task actor).
message EgressRule {
  // Outbound destination hosts (no IP literals, *.svc, or *.cluster.local).
  repeated string hosts = 1;
  // Optional credential header injection handled at the Substrate egress gateway.
  HeaderInjection inject = 2;
}

// HeaderInjection maps to Substrate's CredentialHeader; AX passes credential
// references through without reading or storing raw secret material.
message HeaderInjection {
  string header = 1;
  string credential_uri = 2;
  string prefix = 3;
}
